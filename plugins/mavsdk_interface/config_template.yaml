plugin: mavsdk_interface
cfg:
  id: mavsdk
  topic_ns: UAV
  is_interface: true
  supports:
    autopilot:
    - AutopilotType.PX4
    - AutopilotType.ARDUPILOT
    telem_type:
    - TelemetryType.MAVLINK
  conn_str: udp://:14550
  mav_dialect: PX4
  mav_type: MAV_TYPE_QUADROTOR
  mav_sysid: 1
  mavsdk_log_debug: false

  # Endpoint adapter reports raw OCCID health/readiness facts. Stabilization and
  # vehicle-level arm/takeoff readiness policy belongs to uav_controller.
  consume_control_override: false
  control_override_timeout_s: 0.3
  control_override_send_interval_s: 0.05
  # OCCID control axes are signed [-1, 1]. The MAVSDK adapter maps signed
  # throttle to MAVSDK's unidirectional [0, 1] manual-control throttle.
  control_output_initial:
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
    throttle: -1.0
    aux: []

  # Local routing/rate-control stream names. Payload semantics come from OCCID models.
  state_intervals:
    flight_control: 0.1
    location: 0.2
    attitude: 0.1
    angular_velocity: 0.1
    gnss: 0.5
    power: 0.5
    imu: 0.1
    firmware: 1.0
    control_override: 0.1
    control_output: 0.1
