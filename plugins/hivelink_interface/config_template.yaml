plugin: hivelink_interface
cfg:
  id: hivelink
  rx_poll_interval: 0.05
  bus_poll_interval: 0.05
  in_topic: OCCID/IN
  out_topic: OCCID/OUT
  link_config:
    my_name: <my_name>
    my_id: 0
    udp:
      use: true
      host: 0.0.0.0
      port: 5555
      use_multicast: false
      multicast_group: ''
      multicast_port: 5555
    meshtastic:
      use: false
      radio_serial: ''
      app_portnum: 260
      channel: 0
    mqtt:
      use: false
      base: /hivelink/v2
      broker: ''
      port: 1883
      client_id: ''
      username: ''
      password: ''
    nodemap:
      control:
        ip:
        - 192.168.0.220
        - 5555
